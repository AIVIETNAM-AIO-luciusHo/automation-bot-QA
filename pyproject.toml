[project]
name = "github-bot"
version = "0.1.0"
description = "Bot CLI chuyển file Markdown công việc thành GitHub Issues (dry-run mặc định)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
github-bot = "github_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
